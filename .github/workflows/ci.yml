name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify source, tests, and arm64 release build
        run: bash scripts/compile-check.sh
      - name: Verify local application bundle
        run: bash scripts/bundle.sh --debug
      - name: Confirm build did not rewrite source
        run: git diff --exit-code
